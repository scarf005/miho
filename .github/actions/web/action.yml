name: web
description: Build the web export in build/web.
inputs:
  version: { description: "The version the title shows; the commit when empty.", default: "" }

runs:
  using: composite
  steps:
    - uses: extractions/setup-just@v3
    - name: Versions
      shell: bash
      run: |
        echo "GODOT_VERSION=4.7.2" >> "$GITHUB_ENV"
        echo "EMSDK_VERSION=4.0.20" >> "$GITHUB_ENV"
        echo "MIHO_NIGHTLY=nightly-2026-05-03" >> "$GITHUB_ENV"
        echo "MIHO_EMSDK=$HOME/emsdk" >> "$GITHUB_ENV"
        echo "MIHO_WEB_TEMPLATE=$HOME/miho-web-template.zip" >> "$GITHUB_ENV"
    # Almost all of the build is std and the Rust crates. The toolchain is
    # cached too, as a fresh rust-src makes -Zbuild-std compile std again.
    - uses: actions/cache@v6
      with:
        path: |
          ~/emsdk
          ~/.cargo/registry
          ~/.rustup/toolchains/${{ env.MIHO_NIGHTLY }}-*
          ~/.rustup/update-hashes/${{ env.MIHO_NIGHTLY }}-*
          rust/target
        key: web-${{ env.EMSDK_VERSION }}-${{ env.MIHO_NIGHTLY }}-${{ hashFiles('rust/Cargo.lock', 'rust/.cargo/**', 'rust/src/**') }}
        restore-keys: web-${{ env.EMSDK_VERSION }}-${{ env.MIHO_NIGHTLY }}-
    - name: Godot
      shell: bash
      run: |
        base=https://github.com/godotengine/godot-builds/releases/download/$GODOT_VERSION-stable
        curl -fsSL -o godot.zip "$base/Godot_v$GODOT_VERSION-stable_linux.x86_64.zip"
        curl -fsSL -o templates.tpz "$base/Godot_v$GODOT_VERSION-stable_export_templates.tpz"
        unzip -q godot.zip -d "$HOME/godot"
        dir="$HOME/.local/share/godot/export_templates/$GODOT_VERSION.stable"
        mkdir -p "$dir"
        unzip -q -j templates.tpz 'templates/web*' -d "$dir"
        echo "GODOT=$HOME/godot/Godot_v$GODOT_VERSION-stable_linux.x86_64" >> "$GITHUB_ENV"
    # From `just web-template-release`.
    - name: Web template
      shell: bash
      run: curl -fsSL -o "$MIHO_WEB_TEMPLATE" "https://github.com/$GITHUB_REPOSITORY/releases/download/web-template-$GODOT_VERSION/miho-web-template.zip"
    - name: Emscripten
      shell: bash
      run: |
        [ -d "$MIHO_EMSDK" ] && exit 0
        git clone --depth 1 https://github.com/emscripten-core/emsdk "$MIHO_EMSDK"
        "$MIHO_EMSDK/emsdk" install "$EMSDK_VERSION"
        "$MIHO_EMSDK/emsdk" activate "$EMSDK_VERSION"
    - name: Rust
      shell: bash
      run: |
        rustup toolchain install "$MIHO_NIGHTLY" --profile minimal --component rust-src
        rustup target add wasm32-unknown-emscripten --toolchain "$MIHO_NIGHTLY"
    - shell: bash
      run: '"$GODOT" --headless --path . --import'
    - shell: bash
      env: { VERSION: "${{ inputs.version }}" }
      run: just web "${VERSION:-${GITHUB_SHA::7}}"
