name: web
description: Build the web export in build/web.

runs:
  using: composite
  steps:
    - uses: extractions/setup-just@v3
    - name: Godot
      shell: bash
      env: { GODOT_VERSION: 4.7.2 }
      run: |
        base=https://github.com/godotengine/godot-builds/releases/download/$GODOT_VERSION-stable
        curl -fsSL -o godot.zip "$base/Godot_v$GODOT_VERSION-stable_linux.x86_64.zip"
        curl -fsSL -o templates.tpz "$base/Godot_v$GODOT_VERSION-stable_export_templates.tpz"
        unzip -q godot.zip -d "$HOME/godot"
        dir="$HOME/.local/share/godot/export_templates/$GODOT_VERSION.stable"
        mkdir -p "$dir"
        unzip -q -j templates.tpz 'templates/web*' -d "$dir"
        echo "GODOT=$HOME/godot/Godot_v$GODOT_VERSION-stable_linux.x86_64" >> "$GITHUB_ENV"
    - name: Emscripten
      shell: bash
      env: { EMSDK_VERSION: 4.0.20 }
      run: |
        git clone --depth 1 https://github.com/emscripten-core/emsdk "$HOME/emsdk"
        "$HOME/emsdk/emsdk" install "$EMSDK_VERSION"
        "$HOME/emsdk/emsdk" activate "$EMSDK_VERSION"
        echo "MIHO_EMSDK=$HOME/emsdk" >> "$GITHUB_ENV"
    - name: Rust
      shell: bash
      env: { MIHO_NIGHTLY: nightly-2026-05-03 }
      run: |
        rustup toolchain install "$MIHO_NIGHTLY" --profile minimal --component rust-src
        rustup target add wasm32-unknown-emscripten --toolchain "$MIHO_NIGHTLY"
        echo "MIHO_NIGHTLY=$MIHO_NIGHTLY" >> "$GITHUB_ENV"
    - shell: bash
      run: '"$GODOT" --headless --path . --import'
    - shell: bash
      run: just web
