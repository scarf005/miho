name: deploy

on:
  push: { tags: ["*"] }

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/web
      - uses: KikimoraGames/itch-publish@v0.0.3
        with:
          butlerApiKey: ${{ secrets.BUTLER_API_KEY }}
          gameData: ./build/web
          itchUsername: scarf005
          itchGameId: miho
          buildChannel: html5
          buildNumber: ${{ github.ref_name }}
