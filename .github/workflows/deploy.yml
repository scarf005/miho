name: deploy

on:
  push: { tags: ["*"] }

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/web
      - uses: KikimoraGames/itch-publish@v0.0.3
        with:
          butlerApiKey: ${{ secrets.BUTLER_API_KEY }}
          gameData: ./build/web
          itchUsername: scarf005
          itchGameId: miho
          buildChannel: html5
          buildNumber: ${{ github.ref_name }}

  downloads:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux, channel: linux, templates: "templates/linux_release.x86_64", targets: "" }
          - { platform: windows, channel: windows, templates: "templates/windows_release_x86_64*.exe", targets: x86_64-pc-windows-gnu }
          - { platform: macos, channel: mac, templates: "templates/macos.zip", targets: "x86_64-apple-darwin aarch64-apple-darwin" }
          - { platform: android, channel: android, templates: "templates/android_release.apk", targets: aarch64-linux-android }
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v3
      - name: Godot
        shell: bash
        run: |
          version=4.7.2
          base=https://github.com/godotengine/godot-builds/releases/download/$version-stable
          curl -fsSL -o godot.zip "$base/Godot_v$version-stable_linux.x86_64.zip"
          curl -fsSL -o templates.tpz "$base/Godot_v$version-stable_export_templates.tpz"
          unzip -q godot.zip -d "$HOME/godot"
          dir="$HOME/.local/share/godot/export_templates/$version.stable"
          mkdir -p "$dir"
          unzip -q -j templates.tpz "${{ matrix.templates }}" templates/version.txt -d "$dir"
          echo "GODOT=$HOME/godot/Godot_v$version-stable_linux.x86_64" >> "$GITHUB_ENV"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            rust/target
          key: dist-${{ matrix.platform }}-${{ hashFiles('rust/Cargo.lock', 'rust/src/**') }}
          restore-keys: dist-${{ matrix.platform }}-
      - name: Rust targets
        if: matrix.targets != ''
        run: rustup target add ${{ matrix.targets }}
      # cargo-zigbuild finds zig as `python3 -m ziglang`, so its venv comes first on the PATH.
      - name: Zig
        if: matrix.platform != 'android'
        run: |
          python3 -m venv "$HOME/zig"
          "$HOME/zig/bin/pip" install --quiet cargo-zigbuild
          echo "$HOME/zig/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-java@v5
        if: matrix.platform == 'android'
        with: { distribution: temurin, java-version: 21 }
      - name: Android SDK
        if: matrix.platform == 'android'
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "build-tools;36.0.0" "platforms;android-36" "cmdline-tools;latest" "ndk;27.2.12479018"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      # Without ANDROID_KEYSTORE_BASE64 the APK is signed with a new throwaway key, and each version needs an uninstall before the next.
      - name: Android release key
        if: matrix.platform == 'android'
        env: { KEYSTORE: "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" }
        run: |
          [ -n "$KEYSTORE" ] || exit 0
          base64 -d <<<"$KEYSTORE" > "$RUNNER_TEMP/release.keystore"
          echo "MIHO_ANDROID_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - name: Export
        env:
          MIHO_ANDROID_KEYSTORE_USER: ${{ secrets.ANDROID_KEYSTORE_USER }}
          MIHO_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: just dist "${{ github.ref_name }}" ${{ matrix.platform }}
      - name: butler
        run: |
          curl -fsSL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d "$HOME/butler"
          chmod +x "$HOME/butler/butler"
          echo "$HOME/butler" >> "$GITHUB_PATH"
      - name: itch.io
        env: { BUTLER_API_KEY: "${{ secrets.BUTLER_API_KEY }}" }
        run: just itch-downloads "${{ github.ref_name }}" ${{ matrix.platform }}
