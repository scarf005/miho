<title>미호</title>
<style>
html, body { position: fixed; inset: 0; overflow: hidden; overscroll-behavior: none; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
#miho-inset { position: fixed; visibility: hidden; pointer-events: none; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
</style>
<script>
(() => {
	document.querySelectorAll('meta[name=viewport]').forEach((m) => m.remove());
	const meta = document.createElement('meta');
	meta.name = 'viewport';
	meta.content = 'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover';
	document.head.append(meta);
	const contexts = [];
	const Native = window.AudioContext;
	if (Native) {
		window.AudioContext = class extends Native {
			constructor(...args) {
				super(...args);
				contexts.push(this);
			}
		};
	}
	const unlock = () => contexts.forEach((c) => c.state !== 'running' && c.resume());
	['touchend', 'pointerup', 'mouseup', 'keydown'].forEach((t) => addEventListener(t, unlock, true));
	['gesturestart', 'contextmenu'].forEach((t) => addEventListener(t, (e) => e.preventDefault()));
	window.miho = {
		probe() {
			let el = document.getElementById('miho-inset');
			if (!el) {
				el = document.createElement('div');
				el.id = 'miho-inset';
				document.body.append(el);
			}
			const s = getComputedStyle(el);
			const px = (v) => parseFloat(v) || 0;
			const coarse = matchMedia('(pointer: coarse)').matches ? 1 : 0;
			return [window.devicePixelRatio, px(s.paddingTop), px(s.paddingRight), px(s.paddingBottom), px(s.paddingLeft), coarse].join(',');
		},
	};
})();
</script>
<style>
:root { --bg: #000; --fg: #e0e0e0; --panel: #120e0a; --line: #5b3943; color-scheme: dark }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); overflow: hidden; touch-action: none; }
#canvas { display: block; border: 0; }
#canvas:focus { outline: none; }
#status { position: absolute; inset: 0; background: var(--panel); display: flex; flex-direction: column; justify-content: center; align-items: center; visibility: hidden; }
#status-splash { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; }
#status-progress { position: absolute; bottom: 10%; left: 25%; width: 50%; display: none; }
#status-notice { display: none; margin: 0 2rem; padding: 1rem; border: 1px solid var(--line); background: var(--panel); text-align: center; line-height: 1.3; z-index: 1; }
</style>

<canvas id="canvas"></canvas>
<div id="status">
	<img id="status-splash" src="index.png" alt="">
	<progress id="status-progress"></progress>
	<div id="status-notice"></div>
</div>

<script>
// Artifacts serve only some file types, each up to 15 MB: the engine and its
// side module ship gzipped and the pack renamed. Map the names and unpack on request.
(() => {
	const realFetch = window.fetch.bind(window);
	const gzipped = { 'index.wasm': 'wasm-gz.wasm', 'index.side.wasm': 'side-gz.wasm' };
	window.fetch = async (input, init) => {
		const url = typeof input === 'string' ? input : input.url;
		if (url.endsWith('index.pck')) {
			return realFetch('pck.wasm', init);
		}
		const name = Object.keys(gzipped).find((n) => url.split('/').pop() === n);
		if (!name) {
			return realFetch(input, init);
		}
		const res = await realFetch(gzipped[name], init);
		const bytes = new Uint8Array(await res.arrayBuffer());
		const gzip = bytes[0] === 0x1f && bytes[1] === 0x8b;
		const body = gzip ? new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip')) : bytes;
		return new Response(body, { headers: { 'Content-Type': 'application/wasm' } });
	};
})();
</script>
<script src="index.js"></script>
<script>
const engine = new Engine({
	executable: 'index',
	canvasResizePolicy: 2,
	focusCanvas: true,
	args: [],
	gdextensionLibs: ['miho_native.wasm'],
});
(() => {
	const overlay = document.getElementById('status');
	const progress = document.getElementById('status-progress');
	const notice = document.getElementById('status-notice');
	const fail = (err) => {
		console.error(err);
		notice.textContent = err instanceof Error ? err.message : String(err);
		notice.style.display = 'block';
		progress.style.display = 'none';
	};
	const missing = Engine.getMissingFeatures({ threads: false });
	overlay.style.visibility = 'visible';
	if (missing.length !== 0) {
		fail('Missing browser features: ' + missing.join(', '));
		return;
	}
	progress.style.display = 'block';
	engine.startGame().then(() => overlay.remove(), fail);
})();
</script>
